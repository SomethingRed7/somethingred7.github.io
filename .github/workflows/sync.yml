# 从主仓库 SomethingRed7/visiable_tour_map 同步门户文件到本用户主页仓库(根域名)
# 主仓库是公开的,checkout 无需 token;404.html(管理页跳转)保留在本仓库,不受覆盖
name: Sync portal from visiable_tour_map

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SomethingRed7/visiable_tour_map
          path: src
      - name: Copy portal files
        run: |
          cp src/public/index.html src/public/style.css src/public/api.js src/public/app.js src/public/entry-modal.js src/public/loc-picker.js src/public/share-view.js .
      - name: Commit and push
        run: |
          git config user.name 'gugugaga-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css api.js app.js entry-modal.js loc-picker.js share-view.js
          if ! git diff --cached --quiet; then
            git commit -m "sync portal from visiable_tour_map"
            git push
          else
            echo "no changes"
          fi

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳转中 · 咕咕嘎嘎</title>
<script>
// 咕咕嘎嘎根域名跳转:管理页(write/edit/export)留在 Cloudflare pages.dev 登录
// github.io 只读门户 + 这几个地址做 301 式跳转(GitHub Pages 纯静态,404 页 JS 跳转)
(function () {
  var path = location.pathname;
  var map = {
    '/write': 'https://gugugaga-viw.pages.dev/write.html',
    '/write/': 'https://gugugaga-viw.pages.dev/write.html',
    '/write.html': 'https://gugugaga-viw.pages.dev/write.html',
    '/edit': 'https://gugugaga-viw.pages.dev/edit.html',
    '/edit/': 'https://gugugaga-viw.pages.dev/edit.html',
    '/edit.html': 'https://gugugaga-viw.pages.dev/edit.html',
    '/export': 'https://gugugaga-viw.pages.dev/export.html',
    '/export/': 'https://gugugaga-viw.pages.dev/export.html',
    '/export.html': 'https://gugugaga-viw.pages.dev/export.html'
  };
  if (map[path]) { location.replace(map[path]); return; }
  document.title = '页面不存在 · 咕咕嘎嘎';
  document.write('<div style="font-family:-apple-system,\'PingFang SC\',sans-serif;text-align:center;padding:48px 16px;color:#1f2937">' +
    '<h2 style="font-weight:800">页面不存在</h2>' +
    '<p><a href="' + location.origin + '/">← 回咕咕嘎嘎首页</a></p>' +
    '<p><a href="https://gugugaga-viw.pages.dev/write.html">管理入口</a></p></div>');
})();
</script>
</head>
<body>
</body>
</html>
